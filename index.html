<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#A23B72">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Prezi Planning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<style>
/* VOICE: playful and warm, a gift-planning friend that lives on Jess's phone
   IDEA: a shelf of wrapped presents, one per person, that fills up all year
   PICTURE: chunky cute characters (Pip, Santa, Petal, Tie guy, Sprinkles) and wrapped-gift tiles
   COLOUR and TYPE: Sugarplum pop (bubblegum, berry, mint, gold) on cream; Pacifico wordmark, system sans body
   LAYOUT: phone-first single column, sticky header, bottom tabs, floating add button */
:root{--cream:#FFF4FA;--pink:#F49AC1;--pink2:#E77FAE;--berry:#A23B72;--berry2:#7E2A57;--ink:#3A1328;--mint:#9BE3C9;--mint2:#E1F5EE;--gold:#FFD166;--gold2:#FFF3D1;--blush:#F4C0D1;--blush2:#FBEAF0;--red:#E8414F;--green:#3E9B6E;--muted:#B4889E;color-scheme:light}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;background:var(--cream)}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink)}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* header */
.hdr{position:sticky;top:0;z-index:30;background:var(--cream);border-bottom:2px solid var(--blush)}
.hdr .bar{display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 12px 6px}
.brand{font-family:'Pacifico',cursive;font-size:25px;color:var(--berry);line-height:1.25;white-space:nowrap;margin:0;font-weight:400}
.hdr .sp1{flex:1}
.hbtn{width:42px;height:42px;border-radius:50%;border:2px solid currentColor;background:transparent;display:flex;align-items:center;justify-content:center;padding:0;color:var(--berry)}
.hdr.fest{background:var(--berry);border-bottom:0}.hdr.fest .brand,.hdr.fest .hbtn{color:var(--cream)}
.hdr.xday{background:var(--red)}.hdr.xday .brand{color:var(--gold)}
.lights{display:block;width:100%;height:30px}
/* main */
main{padding:14px 12px calc(110px + env(safe-area-inset-bottom))}
main.enter{animation:enter .35s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2.sec{font-size:14px;font-weight:600;color:var(--berry2);margin:18px 2px 8px}
.card{background:#fff;border:2px solid var(--blush);border-radius:18px;padding:12px 14px}
/* banners */
.banner{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:2px solid var(--ink);border-radius:18px;padding:10px 12px;margin-bottom:10px}
.banner.adv{background:var(--red);color:var(--cream)}
.banner.xd{background:var(--gold);color:var(--ink)}
.banner b{display:block;font-size:15px}.banner small{font-size:13px;opacity:.9}
/* countdown */
.cd{display:flex;align-items:center;justify-content:space-between;gap:8px;border:2px solid;border-radius:18px;padding:12px 14px;margin-bottom:8px}
.cd .lb{font-size:13px;color:var(--berry2)}
.tiles{display:flex;gap:4px;margin:4px 0;perspective:200px}
.ft{display:inline-block;background:var(--berry);color:var(--cream);font-size:26px;font-weight:700;width:36px;text-align:center;border-radius:9px;border:3px solid var(--ink);padding:1px 0;animation:fl .12s ease-out}
.ft.z{background:var(--blush);color:var(--pink2);border-color:var(--pink2)}
@keyframes fl{from{transform:rotateX(90deg)}to{transform:none}}
.today{display:inline-block;background:var(--red);color:var(--cream);font-size:20px;font-weight:700;border:3px solid var(--ink);border-radius:12px;padding:3px 10px;margin:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.chip{font-size:13px;background:#fff;border:1.5px solid var(--blush);border-radius:12px;padding:4px 10px;color:var(--ink);text-align:left}
button.chip{min-height:34px}
.chip.warn{border-color:var(--pink2);background:var(--blush2);color:var(--berry)}
/* people grid */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:#fff;border:2px solid var(--blush);border-radius:16px;padding:8px 4px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:122px}
.tile .nm{font-size:14px;font-weight:600;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ct{font-size:12px;background:var(--blush2);color:var(--berry);border-radius:8px;padding:1px 8px}
.art{position:relative;display:inline-block;line-height:0}
.art .cbo{position:absolute;left:0;top:0;animation:cbout .5s .25s ease-in forwards}
.art .win{animation:wrapin .75s .3s cubic-bezier(.3,1.5,.5,1) both;transform-origin:50% 100%}
@keyframes cbout{to{opacity:0;transform:scale(.7)}}
@keyframes wrapin{0%{opacity:0;transform:scale(.4) rotate(-12deg)}100%{opacity:1;transform:none}}
.wob{animation:wob 3.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes wob{0%,78%,100%{transform:none}82%{transform:rotate(-7deg)}86%{transform:rotate(6deg)}90%{transform:rotate(-4deg)}94%{transform:rotate(2deg)}}
.qm{animation:qm 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes qm{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-4px) rotate(8deg)}}
.tile.add{border-style:dashed;justify-content:center;color:var(--berry);font-weight:600;font-size:14px;gap:6px}
.lid{transform-box:fill-box;transform-origin:0% 100%}
.tile.lift .lid{animation:lift .5s ease-in-out forwards}
@keyframes lift{0%{transform:none}100%{transform:translateY(-16px) rotate(-22deg)}}
/* person */
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--berry);font-weight:600;padding:6px 4px;margin:-4px 0 6px;min-height:44px}
.phead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.phead h2{margin:0;font-size:26px;line-height:1.1}
.phead .grp{font-size:13px;color:var(--berry2)}
.phead .edit{margin-left:auto}
.occ{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.occ .row{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--blush);border-radius:14px;padding:6px 10px}
.occ .row b{font-size:14px}.occ .row span{font-size:13px;color:var(--berry2)}
.occ .row .r{margin-left:auto;text-align:right}
.idea{position:relative;background:#fff;border:2px solid var(--blush);border-radius:16px;padding:10px 12px;margin-bottom:8px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .15s,background .15s}
.idea.pressing{transform:scale(.97);background:var(--blush2)}
.idea .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.lnk{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-size:14px;color:var(--berry);font-weight:600;text-decoration:none;background:var(--blush2);border-radius:10px;padding:5px 10px;max-width:100%}
.lnk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnk .ic{width:16px;height:16px}
.tag{display:inline-block;font-size:12px;background:var(--gold2);color:#7a5200;border-radius:8px;padding:1px 8px;margin-top:6px}
.hint{font-size:13px;color:var(--berry2);margin:2px 2px 10px}
.hist{background:transparent;border:2px dashed var(--blush);border-radius:14px;padding:8px 12px;margin-bottom:6px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.hist.pressing{background:var(--blush2)}
.hist .meta{font-size:12px;color:var(--berry2)}
.empty{text-align:center;color:var(--berry2);font-size:14px;padding:10px 6px}
/* forms */
.f{display:flex;flex-direction:column;gap:8px}
.f textarea,.f input[type=text],.f input[type=date],.f select{width:100%;border:2px solid var(--blush);border-radius:12px;padding:10px 12px;background:#fff;min-height:46px}
.f textarea{resize:vertical;min-height:70px}
.f :focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{min-height:46px;border-radius:14px;border:2px solid var(--ink);background:#fff;font-weight:600;padding:8px 14px}
.btn.pri{background:var(--berry);color:var(--cream)}
.btn.dan{background:#fff;color:#b3261e;border-color:#b3261e}
.btn.gold{background:var(--gold)}
.err{color:#b3261e;font-size:13px;min-height:1px}
.lbl{font-size:13px;font-weight:600;color:var(--berry2);margin:4px 0 0}
.who{display:flex;flex-wrap:wrap;gap:6px}
.who label{position:relative}
.who input{position:absolute;opacity:0}
.who span{display:inline-block;border:2px solid var(--blush);border-radius:12px;padding:7px 11px;background:#fff;font-size:14px;min-height:40px}
.who input:checked+span{background:var(--berry);color:var(--cream);border-color:var(--berry)}
.who input:focus-visible+span{outline:3px solid var(--gold)}
.oc{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--blush);border-radius:12px;padding:6px 8px}
.oc input[type=checkbox]{width:22px;height:22px;accent-color:var(--berry);flex:none}
.oc .on{flex:1;font-size:15px}
.oc input[type=text]{width:110px;min-height:38px;padding:6px 8px;border:2px solid var(--blush);border-radius:10px}
/* tabs + fab */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:#fff;border-top:2px solid var(--blush);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;background:none;border:0;padding:8px 4px 7px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;min-height:56px}
.tabs button.on{color:var(--berry);font-weight:700}
.dot{position:absolute;top:6px;left:calc(50% + 8px);width:10px;height:10px;border-radius:50%;background:var(--red);border:2px solid #fff}
.fab{position:fixed;right:max(16px,calc(50% - 240px + 16px));bottom:calc(72px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;background:var(--berry);color:var(--cream);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;z-index:31;animation:fab 2.4s ease-in-out infinite;padding:0}
.fab .ic{width:30px;height:30px;stroke-width:3}
@keyframes fab{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
/* sheet */
#sheet{position:fixed;inset:0;z-index:50;pointer-events:none}
#sheet .scrim{position:absolute;inset:0;background:rgba(58,19,40,.45);opacity:0;transition:opacity .25s}
#sheet .panel{position:absolute;left:50%;bottom:0;width:100%;max-width:480px;max-height:88vh;overflow:auto;background:var(--cream);border:3px solid var(--ink);border-bottom:0;border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,100%);transition:transform .3s cubic-bezier(.2,1.2,.4,1)}
#sheet.open{pointer-events:auto}#sheet.open .scrim{opacity:1}#sheet.open .panel{transform:translate(-50%,0)}
.panel h3{margin:0 0 10px;font-size:20px}
.panel .acts{display:flex;flex-direction:column;gap:8px}
.panel .acts .btn{width:100%;text-align:left;display:flex;align-items:center;gap:10px}
.grab{width:44px;height:5px;border-radius:3px;background:var(--blush);margin:-6px auto 12px}
.set{border-top:2px dashed var(--blush);padding-top:12px;margin-top:12px}
.set p{font-size:14px;margin:0 0 8px}
.row2{display:flex;gap:8px;flex-wrap:wrap}.row2 .btn{flex:1}
/* toast */
#toast{position:fixed;left:50%;bottom:calc(146px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--cream);border-radius:16px;padding:8px 14px 8px 8px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;opacity:0;transition:.3s;z-index:60;pointer-events:none;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:25;overflow:hidden}
.spk{position:absolute;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.1;transform:scale(.5)}50%{opacity:1;transform:scale(1)}}
.cf{position:fixed;top:-14px;width:9px;height:13px;border-radius:2px;z-index:70;pointer-events:none;animation:cf 3s ease-in forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(640deg);opacity:.2}}
/* character motion */
.bob{animation:bob 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.wig{animation:wig 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.blink{animation:blink 3.6s infinite;transform-box:fill-box;transform-origin:center}
.bu{animation:bl 1.2s infinite}
.tws{animation:tw 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.fk{animation:fk .5s infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:none}50%{transform:translateY(-6px)}}
@keyframes wig{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes blink{0%,92%,100%{transform:none}95%{transform:scaleY(.1)}}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes fk{0%,100%{transform:none}50%{transform:scale(.8,1.2)}}
.spin{animation:spin .7s ease-in-out}@keyframes spin{to{transform:rotate(360deg)}}
/* christmas tab */
.xstage{display:flex;align-items:flex-end;gap:8px;margin:6px 0 8px}
.bub{position:relative;background:#fff;border:2px solid var(--berry);border-radius:16px 16px 16px 4px;padding:8px 24px 8px 10px;font-size:14px;line-height:1.4;min-height:58px}
.holly{position:absolute;top:-10px;right:-6px}
.prog{height:16px;background:var(--blush);border-radius:8px;overflow:hidden;border:2px solid var(--ink);margin-top:4px}
.prog i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--red) 0 6px,#fff 6px 12px);transition:width .4s}
#santa,#aL,#aR{transform-box:fill-box}#santa{transform-origin:50% 100%}#aL,#aR{transform-origin:50% 10%}
.s-worried #santa{animation:sw 3s ease-in-out infinite}.s-thinking #santa{animation:sw 1.4s ease-in-out infinite}
.s-ready #santa,.s-happy #santa{animation:hop .9s ease-in-out infinite}.s-happy #aR{animation:wv .5s ease-in-out infinite alternate}
.s-party #santa{animation:dn .7s linear infinite}.s-party #aR{animation:wv .3s infinite alternate}.s-party #aL{animation:wl .3s infinite alternate}
@keyframes sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes hop{0%,100%{transform:none}50%{transform:translateY(-8px)}}
@keyframes dn{0%,100%{transform:rotate(-12deg)}25%{transform:translateY(-12px)}50%{transform:rotate(12deg)}75%{transform:translateY(-12px)}}
@keyframes wv{from{transform:rotate(-20deg)}to{transform:rotate(-140deg)}}
@keyframes wl{from{transform:rotate(20deg)}to{transform:rotate(140deg)}}
.stock{transform-box:fill-box;transform-origin:50% 0;animation:sock 3s ease-in-out infinite}
@keyframes sock{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.xrow{display:flex;align-items:center;gap:8px}
.xcard{background:#fff;border:2px solid var(--blush);border-radius:14px;padding:8px 10px;margin-bottom:8px}
.xcard.done{border-color:var(--gold);background:#FFFBEF}
.glist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.gline{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--cream);border:2px solid var(--blush);border-radius:12px;padding:7px 10px;min-height:44px;font-size:14px}
.gline span{flex:1}
.gline em{font-style:normal;font-size:12px;font-weight:700;color:#7a5200;background:var(--gold);border-radius:8px;padding:1px 8px}
.gline.on{background:var(--gold2);border-color:var(--gold)}.gline.on .ic{fill:var(--gold)}
.gline.pp{animation:pop .3s}
.tg .n{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--gold);color:var(--ink);font-size:11px;font-weight:700;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center}
.tg{position:relative}
.lk{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--blush);border-radius:12px;padding:8px 10px;min-height:48px}
.lk input{width:22px;height:22px;accent-color:var(--berry);flex:none}
.lk.has{border-color:var(--berry)}
.xrow .who2{flex:1;min-width:0}
.xrow .who2 b{display:block;font-size:15px}
.xrow .who2 small{display:block;font-size:12px;color:var(--berry2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tg{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:#fff;padding:0;display:flex;align-items:center;justify-content:center;flex:none}
.tg.on1{background:var(--berry);color:#fff}.tg.on2{background:var(--gold)}.tg.on2 .ic{fill:var(--ink)}
.tg.pp{animation:pop .3s}@keyframes pop{50%{transform:scale(1.3)}}
.ss{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0 8px;flex-wrap:wrap}
.ss select{flex:1;min-width:150px;min-height:42px;border:2px solid var(--blush);border-radius:12px;padding:6px 10px;background:#fff}
.scene{display:block;width:calc(100% + 24px);margin:16px -12px 0;border-top:3px solid var(--ink)}
@keyframes fly{0%{transform:translate(-190px,92px)}50%{transform:translate(90px,34px)}100%{transform:translate(380px,74px)}}
#sl{animation:fly 11s linear infinite}
@keyframes gal{0%,100%{transform:none}50%{transform:translateY(-3px)}}.gl{animation:gal .4s infinite}
/* advent */
.agrid{display:grid;grid-template-columns:repeat(4,68px);gap:8px;justify-content:center;margin:8px 0 12px}
.door{width:68px;height:60px;position:relative;perspective:300px;padding:0;border:0;background:none}
.door .in{position:absolute;inset:0;background:#fff;border:2px dashed var(--pink2);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--berry)}
.door .flap{position:absolute;inset:0;border:2px solid var(--ink);border-radius:8px;transform-origin:left center;transition:transform .8s cubic-bezier(.3,1.5,.5,1);background-size:296px 400px}
.door.op .flap{transform:rotateY(-105deg)}
.door .num{position:absolute;top:4px;left:4px;min-width:22px;height:22px;border-radius:11px;background:var(--gold);border:2px solid var(--ink);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.door.td .flap{animation:pu 1.4s infinite}
@keyframes pu{0%,100%{box-shadow:0 0 0 0 var(--gold)}50%{box-shadow:0 0 0 5px var(--gold)}}
.door.shk{animation:shk .3s 2}@keyframes shk{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.adet{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid var(--berry);border-radius:16px;padding:10px 12px;animation:enter .4s ease-out}
.adet small{display:block;color:var(--berry);font-weight:700;font-size:12px}
/* nov peek */
#peek{position:fixed;right:max(0px,calc(50% - 240px));bottom:calc(150px + env(safe-area-inset-bottom));z-index:29;transform:translateX(110%);transition:transform .7s cubic-bezier(.3,1.4,.5,1);display:flex;align-items:center;gap:4px;background:none;border:0;padding:0}
#peek.show{transform:translateX(26%)}
#peek .pb{background:#fff;border:2px solid var(--red);border-radius:14px 14px 4px 14px;padding:6px 10px;font-size:13px;font-weight:700;color:var(--red);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<symbol id="f" viewBox="0 0 40 22"><ellipse class="blink" cx="11" cy="7" rx="3" ry="4" fill="#3A1328"/><ellipse class="blink" cx="29" cy="7" rx="3" ry="4" fill="#3A1328"/><circle cx="4" cy="14" r="3.5" fill="#FF6FA5" opacity=".55"/><circle cx="36" cy="14" r="3.5" fill="#FF6FA5" opacity=".55"/><path d="M15 13 Q20 19 25 13" stroke="#3A1328" stroke-width="2.5" fill="none" stroke-linecap="round"/></symbol>
<pattern id="cc" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fff"/><rect width="4" height="8" fill="#E8414F"/></pattern>

<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-5);
const ic=n=>`<svg class="ic" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const KEY='prezi-planning-v1';
const OCC={bday:'Birthday',xmas:'Christmas',mum:"Mother's Day",dad:"Father's Day"};
const GROUPS=['Immediate family','Extended family','Secret Santa crew','Friends','Ideas only'];
const SSG='Secret Santa crew';

/* ---------- data ---------- */
function mk(name,group,occ){const o={};for(const k in OCC)o[k]={on:k in occ,budget:occ[k]||''};return{id:uid(),name,group,occ:o,bday:'',ideas:[],history:[]}}
function seed(){return{v:1,people:[
 mk('Mum','Immediate family',{bday:'$50–60',xmas:'$50–60',mum:'$50–60'}),
 mk('Dad','Immediate family',{bday:'$50–60',xmas:'$50–60',dad:'$50–60'}),
 mk('Daniel','Immediate family',{bday:'$50',xmas:'$50'}),
 mk('Granddad','Extended family',{bday:'$50–60',xmas:'$50–60'}),
 mk('Uncle Jason','Extended family',{bday:'$50–60',xmas:'$50–60'}),
 mk('Auntie Rose','Extended family',{bday:'$50–60',xmas:'$50–60'}),
 mk('Nona',SSG,{xmas:'~$30'}),mk('Uncle Paul',SSG,{xmas:'~$30'}),mk('Nick',SSG,{xmas:'~$30'}),mk('Tessa',SSG,{xmas:'~$30'}),
 mk('Ben','Ideas only',{}),mk('Siena','Ideas only',{})],
 xmas:{drawn:'',items:{}},advent:{year:0,opened:[]},settings:{sound:true,pretend:''}}}
let S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
function fix(s){if(!s||!Array.isArray(s.people))return null;s.xmas=s.xmas||{drawn:'',items:{}};s.xmas.items=s.xmas.items||{};s.advent=s.advent||{year:0,opened:[]};s.settings=Object.assign({sound:true,pretend:''},s.settings||{});s.people.forEach(p=>{p.ideas=p.ideas||[];p.history=p.history||[];p.occ=p.occ||{};for(const k in OCC)p.occ[k]=p.occ[k]||{on:false,budget:''}});return s}
S=fix(S)||seed();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const byId=id=>S.people.find(p=>p.id===id);

/* ---------- dates ---------- */
function now(){const p=S.settings.pretend;if(p){const[y,m,d]=p.split('-').map(Number);return new Date(y,m-1,d)}const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())}
function nthSun(y,m,n){const d=new Date(y,m,1);return new Date(y,m,(7-d.getDay())%7+1+7*(n-1))}
function nextOf(fn){const t=now();let d=fn(t.getFullYear());if(d<t)d=fn(t.getFullYear()+1);return d}
const XMAS=y=>new Date(y,11,25),MUMS=y=>nthSun(y,4,2),DADS=y=>nthSun(y,8,1);
const daysTo=d=>Math.round((d-now())/864e5);
const fmt=d=>d.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});
const fmtDM=d=>d.toLocaleDateString('en-AU',{day:'numeric',month:'short'});
function bdMD(b){const q=String(b||'').split('-').filter(Boolean).map(Number);return q.length>=2?[q[q.length-2],q[q.length-1]]:[0,0]}
function bdayNext(p){if(!p.bday)return null;const[m,d]=bdMD(p.bday);if(!m||!d)return null;return nextOf(y=>new Date(y,m-1,d))}
function occDate(p,k){return k==='xmas'?nextOf(XMAS):k==='mum'?nextOf(MUMS):k==='dad'?nextOf(DADS):bdayNext(p)}
function season(){const t=now(),m=t.getMonth(),d=t.getDate();return{nov:m===10,advent:m===11&&d<=24,xday:m===11&&d===25,festive:m===11&&d<=25,wrap:m===10||m===11,day:d,year:t.getFullYear()}}
function events(){const E=[],P=S.people,any=k=>P.some(p=>p.occ[k].on);
 if(any('xmas'))E.push({k:'xmas',label:'Christmas',date:nextOf(XMAS)});
 if(any('mum'))E.push({k:'mum',label:"Mother's Day",date:nextOf(MUMS)});
 if(any('dad'))E.push({k:'dad',label:"Father's Day",date:nextOf(DADS)});
 P.forEach(p=>{if(p.occ.bday.on){const d=bdayNext(p);if(d)E.push({k:'bday',label:p.name+"'s birthday",date:d,pid:p.id})}});
 E.forEach(e=>e.days=daysTo(e.date));return E.sort((a,b)=>a.days-b.days)}

/* ---------- characters ---------- */
const WA=[['#F49AC1','#A23B72'],['#9BE3C9','#A23B72'],['#FFD166','#E77FAE'],['#A23B72','#FFD166'],['#E77FAE','#FFF4FA'],['#9BE3C9','#E77FAE']];
const WD=[['url(#cc)','#3E9B6E'],['url(#gd)','#E8414F'],['url(#rs)','#3E9B6E'],['#3E9B6E','#E8414F'],['url(#bs)','#E8414F'],['#E8414F','#FFD166']];
function wrapOf(p){const i=Math.max(0,S.people.indexOf(p)),W=season().wrap?WD:WA;return W[i%W.length]}
function gift(w,s,holly){return`<svg width="${s}" height="${Math.round(s*64/70)}" viewBox="0 0 70 64" aria-hidden="true"><rect x="6" y="24" width="58" height="38" rx="6" fill="${w[0]}" stroke="#3A1328" stroke-width="2.5"/><rect x="31" y="25" width="8" height="36" fill="${w[1]}"/><g class="lid"><rect x="2" y="14" width="66" height="13" rx="5" fill="${w[0]}" stroke="#3A1328" stroke-width="2.5"/><rect x="31" y="15" width="8" height="11" fill="${w[1]}"/><ellipse cx="25" cy="8" rx="9" ry="6" fill="${w[1]}" stroke="#3A1328" stroke-width="2"/><ellipse cx="45" cy="8" rx="9" ry="6" fill="${w[1]}" stroke="#3A1328" stroke-width="2"/><circle cx="35" cy="10" r="4" fill="${w[1]}" stroke="#3A1328" stroke-width="2"/>${holly?'<ellipse cx="58" cy="12" rx="5" ry="3" fill="#3E9B6E" stroke="#3A1328" stroke-width="1.2" transform="rotate(-25 58 12)"/><circle cx="54" cy="15" r="2.2" fill="#E8414F" stroke="#3A1328" stroke-width="1"/>':''}</g></svg>`}
const ACC={
 bow:'<ellipse cx="34" cy="21" rx="10" ry="7" fill="#A23B72" stroke="#3A1328" stroke-width="4"/><ellipse cx="56" cy="21" rx="10" ry="7" fill="#A23B72" stroke="#3A1328" stroke-width="4"/><circle cx="45" cy="23" r="5" fill="#7E2A57" stroke="#3A1328" stroke-width="4"/>',
 hat:'<path d="M18 30 Q30 -6 68 4 L72 30Z" fill="#E8414F" stroke="#3A1328" stroke-width="4" stroke-linejoin="round"/><rect x="12" y="26" width="66" height="12" rx="6" fill="#fff" stroke="#3A1328" stroke-width="4"/><circle cx="68" cy="5" r="7" fill="#fff" stroke="#3A1328" stroke-width="4"/>',
 antlers:'<path d="M32 30 L26 8 M29 18 L18 14 M58 30 L64 8 M61 18 L72 14" stroke="#8B5A3C" stroke-width="5" stroke-linecap="round"/>',
 tinsel:'<path d="M14 42 Q22 36 30 42 Q38 48 46 42 Q54 36 62 42 Q70 48 76 42" fill="none" stroke="#FFD166" stroke-width="6" stroke-linecap="round"/><path d="M62 44 L66 62" stroke="#FFD166" stroke-width="5" stroke-linecap="round"/>',
 sunnies:'<rect x="28" y="54" width="15" height="10" rx="4" fill="#3A1328"/><rect x="47" y="54" width="15" height="10" rx="4" fill="#3A1328"/><path d="M43 58 H47" stroke="#3A1328" stroke-width="2.5"/>',
 elf:'<path d="M18 32 Q36 -8 82 8 Q62 12 72 32Z" fill="#3E9B6E" stroke="#3A1328" stroke-width="3" stroke-linejoin="round"/><rect x="14" y="27" width="62" height="11" rx="5.5" fill="#E8414F" stroke="#3A1328" stroke-width="3"/><circle cx="82" cy="8" r="5" fill="#FFD166" stroke="#3A1328" stroke-width="2.5"/>'};
function pip(o,s,cls='bob'){const extra=o==='tinsel'||o==='sunnies'?ACC.bow:'';const top=o==='bow'?ACC.bow:'';const face=o==='sunnies'?'':'<use href="#f" x="25" y="52" width="40" height="22"/>';const smile=o==='sunnies'?'<path d="M40 70 Q45 75 50 70" stroke="#3A1328" stroke-width="3" fill="none" stroke-linecap="round"/>':'';return`<svg width="${s}" height="${s}" viewBox="0 0 90 90" aria-hidden="true"><g class="${cls}"><rect x="18" y="38" width="54" height="44" rx="10" fill="#F49AC1" stroke="#3A1328" stroke-width="4"/><rect x="41" y="40" width="8" height="40" fill="#A23B72"/><rect x="14" y="28" width="62" height="14" rx="6" fill="#E77FAE" stroke="#3A1328" stroke-width="4"/>${top}${extra}${face}${smile}${o!=='bow'?ACC[o]||'':''}</g></svg>`}
function petal(s){return`<svg width="${s}" height="${s}" viewBox="0 0 90 90" aria-hidden="true"><g class="wig"><path d="M30 60 L45 86 L60 60Z" fill="#9BE3C9" stroke="#3A1328" stroke-width="3" stroke-linejoin="round"/>${[[62,36],[53.5,51],[36.5,51],[28,36],[36.5,21],[53.5,21]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="10" fill="#F49AC1" stroke="#3A1328" stroke-width="3"/>`).join('')}<circle cx="45" cy="36" r="15" fill="#FFD166" stroke="#3A1328" stroke-width="3"/><ellipse class="blink" cx="40" cy="33" rx="2.5" ry="3.5" fill="#3A1328"/><ellipse class="blink" cx="50" cy="33" rx="2.5" ry="3.5" fill="#3A1328"/><path d="M41 39 Q45 43 49 39" stroke="#3A1328" stroke-width="2.5" fill="none" stroke-linecap="round"/></g></svg>`}
function tie(s){return`<svg width="${s}" height="${s}" viewBox="0 0 90 90" aria-hidden="true"><g class="wig" style="transform-origin:50% 0"><path d="M36 28 L54 28 L68 66 L45 86 L22 66Z" fill="#A23B72" stroke="#3A1328" stroke-width="3" stroke-linejoin="round"/><path d="M30 72 L60 42 M38 80 L64 54" stroke="#FFD166" stroke-width="3"/><polygon points="32,12 58,12 54,28 36,28" fill="#E77FAE" stroke="#3A1328" stroke-width="3" stroke-linejoin="round"/><circle cx="38" cy="45" r="6.5" fill="#FFF4FA" stroke="#3A1328" stroke-width="2.5"/><circle cx="52" cy="45" r="6.5" fill="#FFF4FA" stroke="#3A1328" stroke-width="2.5"/><path d="M44.5 45 H45.5" stroke="#3A1328" stroke-width="2.5"/><ellipse class="blink" cx="38" cy="45" rx="2" ry="3" fill="#3A1328"/><ellipse class="blink" cx="52" cy="45" rx="2" ry="3" fill="#3A1328"/><path d="M35 57 Q40 52 45 56 Q50 52 55 57 Q50 61 45 58 Q40 61 35 57Z" fill="#3A1328"/><path d="M41 63 Q45 66 49 63" stroke="#3A1328" stroke-width="2.5" fill="none" stroke-linecap="round"/></g></svg>`}
function cupcake(s){return`<svg width="${s}" height="${s}" viewBox="0 0 90 90" aria-hidden="true"><ellipse class="fk" cx="45" cy="10" rx="4" ry="6" fill="#FFBF3C" stroke="#3A1328" stroke-width="2"/><g class="bob"><rect x="42" y="16" width="6" height="16" rx="2" fill="#F49AC1" stroke="#3A1328" stroke-width="2.5"/><path d="M24 54 H66 L60 84 H30Z" fill="#F49AC1" stroke="#3A1328" stroke-width="3" stroke-linejoin="round"/><path d="M20 56 Q16 40 31 40 Q33 28 45 30 Q57 28 59 40 Q74 40 70 56Z" fill="#9BE3C9" stroke="#3A1328" stroke-width="3" stroke-linejoin="round"/><rect x="32" y="40" width="5" height="2.5" rx="1" fill="#A23B72" transform="rotate(30 34 41)"/><rect x="52" y="38" width="5" height="2.5" rx="1" fill="#FFD166" transform="rotate(-25 54 39)"/><rect x="44" y="45" width="5" height="2.5" rx="1" fill="#E8414F"/><use href="#f" x="25" y="58" width="40" height="22"/></g></svg>`}
function tree(w,withPip){const vb=withPip?110:60;return`<svg width="${w}" height="${Math.round(w*70/vb)}" viewBox="0 0 ${vb} 70" aria-hidden="true"><rect x="25" y="61" width="10" height="8" fill="#8B5A3C" stroke="#3A1328" stroke-width="2"/><polygon points="30,30 4,62 56,62" fill="#3E9B6E" stroke="#3A1328" stroke-width="2.5" stroke-linejoin="round"/><polygon points="30,18 9,46 51,46" fill="#3E9B6E" stroke="#3A1328" stroke-width="2.5" stroke-linejoin="round"/><polygon points="30,8 13,32 47,32" fill="#3E9B6E" stroke="#3A1328" stroke-width="2.5" stroke-linejoin="round"/>${[[24,27,'#E8414F',0],[36,38,'#FFD166',.4],[20,42,'#F49AC1',.8],[32,53,'#E8414F',.2],[16,58,'#FFD166',.6],[45,57,'#F49AC1',1]].map(b=>`<circle class="bu" style="animation-delay:${b[3]}s" cx="${b[0]}" cy="${b[1]}" r="3" fill="${b[2]}"/>`).join('')}<path class="tws" d="M30 0 L32 5 L37 7 L32 9 L30 14 L28 9 L23 7 L28 5Z" fill="#FFD166" stroke="#3A1328" stroke-width="1.5"/>${withPip?`<g transform="translate(60,22) scale(.52)"><g class="bob"><rect x="18" y="38" width="54" height="44" rx="10" fill="#F49AC1" stroke="#3A1328" stroke-width="4"/><rect x="41" y="40" width="8" height="40" fill="#A23B72"/>${ACC.hat}<use href="#f" x="25" y="52" width="40" height="22"/></g></g>`:''}</svg>`}
function santaHead(s,wave){return`<svg width="${s}" height="${s}" viewBox="0 0 90 90" aria-hidden="true"><g class="bob">${wave?'<g class="wig" style="transform-origin:50% 100%"><ellipse cx="80" cy="56" rx="7" ry="9" fill="#FFD9C2" stroke="#3A1328" stroke-width="3"/></g>':''}<circle cx="45" cy="46" r="22" fill="#FFD9C2" stroke="#3A1328" stroke-width="3"/><path d="M23 48 Q24 76 45 76 Q66 76 67 48 Q56 56 45 56 Q34 56 23 48Z" fill="#fff" stroke="#3A1328" stroke-width="3" stroke-linejoin="round"/><path d="M34 54 Q39 50 45 54 Q51 50 56 54 Q51 59 45 56 Q39 59 34 54Z" fill="#fff" stroke="#3A1328" stroke-width="2.5"/><ellipse class="blink" cx="37" cy="43" rx="3" ry="4" fill="#3A1328"/><ellipse class="blink" cx="53" cy="43" rx="3" ry="4" fill="#3A1328"/><circle cx="45" cy="49" r="4" fill="#F0997B" stroke="#3A1328" stroke-width="2"/><path d="M41 63 Q45 67 49 63" stroke="#3A1328" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M23 33 Q28 2 62 7 L68 33Z" fill="#E8414F" stroke="#3A1328" stroke-width="3" stroke-linejoin="round"/><rect x="20" y="27" width="50" height="11" rx="5.5" fill="#fff" stroke="#3A1328" stroke-width="3"/><circle cx="63" cy="7" r="6" fill="#fff" stroke="#3A1328" stroke-width="3"/></g></svg>`}
const CHAR={xmas:s=>tree(s*1.5,true),mum:petal,dad:tie,bday:cupcake};
const CBG={xmas:['#FFF4FA','#E8414F'],mum:['#E1F5EE','#9BE3C9'],dad:['#FFF3D1','#FFD166'],bday:['#FBEAF0','#F49AC1']};

/* ---------- fx ---------- */
let ac=null;
function bells(){if(!S.settings.sound)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;ac=ac||new A();if(ac.state==='suspended')ac.resume();const t=ac.currentTime;[2093,2637,2349,3136,2793].forEach((f,i)=>{const d=i*.07,o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.1,t+d+.005);g.gain.exponentialRampToValueAtTime(.001,t+d+.6);o.connect(g);g.connect(ac.destination);o.start(t+d);o.stop(t+d+.65)})}catch(e){}}
function confetti(n=50){const C=['#F49AC1','#9BE3C9','#FFD166','#A23B72','#E8414F','#3E9B6E'];for(let k=0;k<n;k++){const d=document.createElement('div');d.className='cf';d.style.left=Math.random()*100+'vw';d.style.background=C[k%C.length];d.style.animationDelay=Math.random()*.7+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),4200)}}
let toastT;function toast(msg,withPip=true){const t=$('#toast');t.innerHTML=(withPip?pip(season().festive?'hat':'bow',34,'spin'):'')+`<span>${esc(msg)}</span>`;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}
function sparkles(on){const fx=$('#fx');if(!on){fx.innerHTML='';fx.dataset.on='';return}if(fx.dataset.on)return;fx.dataset.on='1';const SC=['#FFD166','#F49AC1','#9BE3C9'];let h='';for(let k=0;k<18;k++){const sz=8+Math.random()*9;h+=`<svg class="spk" width="${sz}" height="${sz}" viewBox="0 0 12 12" style="left:${Math.random()*96}%;top:${8+Math.random()*80}%;animation-delay:${(Math.random()*2.4).toFixed(2)}s"><path d="M6 0 L7.5 4.5 L12 6 L7.5 7.5 L6 12 L4.5 7.5 L0 6 L4.5 4.5Z" fill="${SC[k%3]}"/></svg>`}fx.innerHTML=h}
function lightsSVG(){const LC=['#FFD166','#9BE3C9','#F49AC1','#FF6B5B'];let b='';for(let k=0;k<16;k++){const x=11+k*21,y=4+11*Math.sin(Math.PI*(x%85)/85);b+=`<ellipse class="bu" style="animation-delay:${(k%4)*.3}s" cx="${x}" cy="${(y+7).toFixed(1)}" rx="4" ry="6" fill="${LC[k%4]}" stroke="#3A1328" stroke-width="1.5"/>`}return`<svg class="lights" viewBox="0 0 340 30" preserveAspectRatio="none" aria-hidden="true"><path d="M0 4 Q42 26 85 4 Q127 26 170 4 Q212 26 255 4 Q297 26 340 4" fill="none" stroke="#3A1328" stroke-width="2"/>${b}</svg>`}

function vXmas(){const se=season(),d=daysTo(nextOf(XMAS)),L=xList(),st=santaState();const W=WD;

 if(ssP.length)h+=`<div class="ss">${ic('gift')}<label for="ssSel">Secret Santa, you drew</label><select id="ssSel"><option value="">Not drawn yet</option>${ssP.map(p=>`<option value="${p.id}" ${S.xmas.drawn===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>`;
 h+=`<p class="hint" style="margin-bottom:8px">Tap the bulb to choose one or more gifts for each person, then tap each gift once it's bought.</p>`;
 h+=L.length?L.map(p=>{const it=item(p),i=S.people.indexOf(p),g=it.gifts,done=allBought(p);return`<div class="xcard${done?' done':''}"><div class="xrow">${gift(W[i%W.length],38)}<div class="who2"><b>${esc(p.name)}</b><small>${p.group===SSG?'Secret Santa · ':''}Budget ${esc(p.occ.xmas.budget||'not set')}${done?' · All bought!':''}</small></div><button class="tg ${g.length?'on1':''}" data-act="lock" data-pid="${p.id}" aria-label="Choose gifts for ${esc(p.name)}">${ic('bulb')}${g.length?`<span class="n">${g.length}</span>`:''}</button></div>${g.length?`<div class="glist">${g.map((z,j)=>`<button class="gline ${z.bought?'on':''}" data-act="buy" data-pid="${p.id}" data-gi="${j}" aria-pressed="${z.bought}">${ic('star')}<span>${esc(gText(p,z))}</span>${z.bought?'<em>Bought</em>':''}</button>`).join('')}</div>`:`<small style="display:block;font-size:12px;color:var(--berry2);margin-top:4px">No gifts locked in yet</small>`}</div>`}).join(''):`<div class="empty">No one has Christmas ticked yet.</div>`;

function render(anim){renderChrome();const v=$('#view');let h;
 if(pid&&byId(pid))h=vPerson(byId(pid));else if(tab==='xmas')h=vXmas();else if(tab==='advent')h=vAdvent();else{pid=null;h=vHome()}
 v.innerHTML=h;if(anim){v.classList.remove('enter');void v.offsetWidth;v.classList.add('enter');rollAll()}
 if(tab==='xmas'&&!pid)applySanta();
 $('#fab').style.display=$('#sheet').classList.contains('open')?'none':'flex'}

function closeSheet(){const w=$('#sheet');w.classList.remove('open');$('#fab').style.display='flex';setTimeout(()=>{if(!w.classList.contains('open'))w.innerHTML=''},300)}

function quickAdd(){const cur=pid;sheet(`<h3>New gift idea</h3><form novalidate class="f" id="quickForm"><p class="lbl">Who's it for?</p><div class="who">${S.people.map(p=>`<label><input type="radio" name="who" value="${p.id}" ${p.id===cur?'checked':''}><span>${esc(p.name)}</span></label>`).join('')}</div><textarea name="t" rows="3" placeholder="Type a gift idea" aria-label="Gift idea" data-focus></textarea><input type="text" autocapitalize="off" autocorrect="off" spellcheck="false" name="u" inputmode="url" placeholder="Link to the product (optional)" aria-label="Link (optional)"><div class="err"></div><button class="btn pri">Save idea</button><button type="button" class="btn" data-act="close">Cancel</button></form>`)}
function lockSheet(p){const g=item(p).gifts,has=id=>g.some(z=>z.iid===id);sheet(`<h3>Gifts for ${esc(p.name)}</h3><p class="hint">Tick every idea you're going with. Mix big and small to make up the budget (${esc(p.occ.xmas.budget||'not set')}).</p><form novalidate class="f" id="lockForm" data-pid="${p.id}">${p.ideas.map(i=>`<label class="lk ${has(i.id)?'has':''}"><input type="checkbox" name="pick" value="${i.id}" ${has(i.id)?'checked':''}><span>${esc(i.text)}${g.find(z=>z.iid===i.id&&z.bought)?' <span class="tag" style="margin:0">Bought</span>':''}</span></label>`).join('')||`<p class="hint">${esc(p.name)} has no ideas yet. Add one below.</p>`}<textarea name="t" rows="2" placeholder="Add a new idea and lock it in" aria-label="New idea"></textarea><div class="err"></div><button class="btn pri">Save gifts</button><button type="button" class="btn" data-act="close">Cancel</button></form>`)}
function settingsSheet(){const P=[['','Today (real date)'],['2027-04-16','16 April: everyday look'],['2026-11-20','20 November: Christmas is coming'],['2026-12-12','12 December: December takeover'],['2026-12-25','25 December: Christmas Day']];
 sheet(`<h3>Settings</h3><div class="set" style="border:0;margin:0;padding:0"><button class="btn" style="width:100%" data-act="sound">${ic(S.settings.sound?'bell':'belloff')} Sleigh bells: ${S.settings.sound?'on':'off'}</button></div>
 <div class="set"><p><b>Backup</b><br>Everything is saved on this phone. Save a backup now and then and keep it in Google Drive.</p><div class="row2"><button class="btn" data-act="backup-file">Save backup file</button><button class="btn" data-act="backup-copy">Copy backup</button></div><p style="margin-top:10px"><b>Restore</b><br>Choose a backup file, or paste a copied backup.</p><div class="f"><input type="file" id="restoreFile" accept=".json,application/json" aria-label="Backup file"><textarea id="restoreText" rows="2" placeholder="Paste a backup here" aria-label="Paste a backup"></textarea><div class="err" id="restoreErr"></div><button class="btn" data-act="restore">Restore backup</button></div></div>
 <div class="set"><p><b>Preview the seasons</b><br>Pretend it's another day to see each look.</p><select id="pretend" class="btn" style="width:100%;text-align:left">${P.map(o=>`<option value="${o[0]}" ${S.settings.pretend===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>
 <div class="set"><p><b>Christmas</b><br>After Christmas, move bought gifts into everyone's gift history and reset the checklist.</p><button class="btn" style="width:100%" data-act="wrap-xmas">${ic('gift')} Wrap up Christmas</button></div>
 <div class="set"><button class="btn dan" style="width:100%" data-act="reset">Start again with the starting list</button></div>
 <div class="set"><button class="btn" style="width:100%" data-act="close">Done</button></div>`)}
function confirmSheet(title,body,act,data,label){sheet(`<h3>${esc(title)}</h3><p>${esc(body)}</p><div class="acts"><button class="btn dan" data-act="${act}" ${data}>${esc(label)}</button><button class="btn" data-act="close">Cancel</button></div>`)}

/* ---------- actions ---------- */
function backupText(){return JSON.stringify(S)}
const ACT={
 close:closeSheet,
 settings:settingsSheet,
 sound(){S.settings.sound=!S.settings.sound;save();if(S.settings.sound)bells();if($('#sheet').classList.contains('open')&&$('#pretend'))settingsSheet();render(false)},
 'add-person'(){personSheet(null)},
 'edit-person'(el){personSheet(byId(el.dataset.pid))},
 'del-person'(el){const p=byId(el.dataset.pid);confirmSheet(`Remove ${p.name}?`,`Their ideas and gift history will be removed too.`,'confirm-del-person',`data-pid="${p.id}"`,'Remove')},
 'confirm-del-person'(el){const p=byId(el.dataset.pid);S.people=S.people.filter(x=>x!==p);delete S.xmas.items[p.id];if(S.xmas.drawn===p.id)S.xmas.drawn='';save();closeSheet();toast(`${p.name} removed`,false);go('home')},
 'edit-idea'(el){const p=byId(el.dataset.pid);editIdea(p,ideaOf(p,el.dataset.iid))},
 'gift-idea'(el){const p=byId(el.dataset.pid);giftSheet(p,ideaOf(p,el.dataset.iid))},
 'del-idea'(el){const p=byId(el.dataset.pid),i=ideaOf(p,el.dataset.iid);confirmSheet('Delete this idea?',i.text,'confirm-del-idea',`data-pid="${p.id}" data-iid="${i.id}"`,'Delete')},
 'confirm-del-idea'(el){const p=byId(el.dataset.pid);p.ideas=p.ideas.filter(i=>i.id!==el.dataset.iid);setGifts(p,item(p).gifts.filter(g=>g.iid!==el.dataset.iid));save();closeSheet();render(false);toast('Idea deleted',false)},
 'hist-back'(el){const p=byId(el.dataset.pid),g=p.history.find(x=>x.id===el.dataset.hid);p.history=p.history.filter(x=>x!==g);p.ideas.push({id:uid(),text:g.text,url:g.url||'',created:Date.now()});save();closeSheet();render(false);toast('Moved back to ideas')},
 'hist-del'(el){const p=byId(el.dataset.pid);p.history=p.history.filter(x=>x.id!==el.dataset.hid);save();closeSheet();render(false);toast('Removed from history',false)},
 lock(el){lockSheet(byId(el.dataset.pid))},
 buy(el){const p=byId(el.dataset.pid),g=item(p).gifts,z=g[+el.dataset.gi];if(!z)return;z.bought=!z.bought;setGifts(p,g);save();if(z.bought){bells();if(allBought(p))confetti(20)}render(false);const b=document.querySelector(`.gline[data-pid="${p.id}"][data-gi="${el.dataset.gi}"]`);b&&b.classList.add('pp')},
 'wrap-xmas'(){confirmSheet('Wrap up Christmas?','Bought gifts with a locked-in idea move into each person\'s gift history. The checklist and Secret Santa draw reset for next year.','confirm-wrap','','Wrap it up')},
 'confirm-wrap'(){let n=0;const y=now().getMonth()>=6?now().getFullYear():now().getFullYear()-1;S.people.forEach(p=>{item(p).gifts.forEach(z=>{if(!z.bought)return;const i=ideaOf(p,z.iid);p.ideas=p.ideas.filter(x=>x.id!==z.iid);p.history.push({id:uid(),text:i?i.text:z.text,url:i&&i.url||'',occ:'Christmas '+y,date:Date.now()});n++})});S.xmas={drawn:'',items:{}};save();closeSheet();render(true);confetti(40);toast(n?`${n} ${n===1?'gift':'gifts'} moved to history`:'Checklist reset for next year')},
 reset(){confirmSheet('Start again?','This replaces everything with the starting list of people. Save a backup first if you want to keep your ideas.','confirm-reset','','Start again')},
 'confirm-reset'(){const keep=S.settings;S=seed();S.settings=keep;save();closeSheet();go('home');toast('Fresh start!')},
 'backup-file'(){const blob=new Blob([backupText()],{type:'application/json'}),name=`prezi-planning-backup-${new Date().toISOString().slice(0,10)}.json`;try{const file=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'Prezi Planning backup'}).catch(()=>{});return}}catch(e){}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('Backup file saved',false)},
 'backup-copy'(){try{navigator.clipboard.writeText(backupText()).then(()=>toast('Backup copied',false),()=>toast("Couldn't copy here",false))}catch(e){toast("Couldn't copy here",false)}},
 restore(){const err=$('#restoreErr'),f=$('#restoreFile').files[0],t=$('#restoreText').value.trim();const apply=txt=>{let d=null;try{d=fix(JSON.parse(txt))}catch(e){}if(!d){err.textContent="That doesn't look like a Prezi Planning backup.";return}S=d;save();closeSheet();go('home');toast('Backup restored')};if(f){const r=new FileReader();r.onload=()=>apply(r.result);r.readAsText(f)}else if(t)apply(t);else err.textContent='Choose a backup file or paste one first.'},
 door(el){const n=+el.dataset.n,se=season();if(n>se.day){el.classList.remove('shk');void el.offsetWidth;el.classList.add('shk');advMsg=`<div class="empty">No peeking! Door ${n} opens on ${n} December.</div>`;$('#adet').innerHTML=advMsg;return}if(!advOpen(n)){S.advent.opened.push(n);save();el.classList.add('op');el.classList.remove('td');bells();renderChrome()}advMsg=advCard(n);$('#adet').innerHTML=advMsg}
};
function flashBtn(id,act){const b=document.querySelector(`.tg[data-act="${act}"][data-pid="${id}"]`);if(b)b.classList.add('pp')}

/* ---------- events ---------- */
let lp=null,lpFired=false;
function hold(el){const p=byId(el.dataset.pid);if(!p)return;if(el.dataset.hold==='idea'){const i=ideaOf(p,el.dataset.iid);i&&ideaMenu(p,i)}else{const g=p.history.find(x=>x.id===el.dataset.hid);g&&histMenu(p,g)}}
const cancelLp=()=>{if(lp){clearTimeout(lp.t);lp.el.classList.remove('pressing');lp=null}};
document.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-hold]');if(!el)return;lpFired=false;el.classList.add('pressing');lp={el,x:e.clientX,y:e.clientY,t:setTimeout(()=>{lpFired=true;el.classList.remove('pressing');try{navigator.vibrate&&navigator.vibrate(15)}catch(_){}lp=null;hold(el)},480)}});
document.addEventListener('pointerup',cancelLp);document.addEventListener('pointercancel',cancelLp);
document.addEventListener('pointermove',e=>{if(lp&&Math.hypot(e.clientX-lp.x,e.clientY-lp.y)>10)cancelLp()});
document.addEventListener('contextmenu',e=>{const el=e.target.closest('[data-hold]');if(el){e.preventDefault();if(!lpFired){cancelLp();lpFired=true;hold(el)}}});
document.addEventListener('click',e=>{
 if(lpFired&&e.target.closest('[data-hold]')){e.preventDefault();lpFired=false;return}
 const a=e.target.closest('[data-act]');if(a){e.preventDefault();ACT[a.dataset.act]&&ACT[a.dataset.act](a);return}
 const t=e.target.closest('[data-person]');if(t){const id=t.dataset.person;if(t.classList.contains('tile')){t.classList.add('lift');setTimeout(()=>go('home',id),420)}else go('home',id);return}
 const g=e.target.closest('[data-go]');if(g){advMsg='';go(g.dataset.go);return}
});
$('#fab').addEventListener('click',quickAdd);
$('#peek').addEventListener('click',()=>go('xmas'));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sheet').classList.contains('open'))closeSheet()});
document.addEventListener('change',e=>{
 {const fm=e.target.closest&&e.target.closest('form');const er=fm&&fm.querySelector('.err');if(er)er.textContent=''}
 if(e.target.id==='ssSel'){S.xmas.drawn=e.target.value;save();render(false);if(e.target.value)toast(`Secret Santa: ${byId(e.target.value).name}`)}
 if(e.target.id==='pretend'){S.settings.pretend=e.target.value;save();advMsg='';closeSheet();lastSanta='';go(season().advent?tab:(tab==='advent'?'home':tab),pid);if(season().xday)confetti(70)}
});
function celebrate(){confetti(24);const b=$('#fab');b.classList.remove('spin');void b.offsetWidth;b.classList.add('spin')}
document.addEventListener('submit',e=>{const f=e.target;e.preventDefault();const err=f.querySelector('.err');const T=f.t?f.t.value.trim():'';
 if(f.id==='addIdea'||f.id==='quickForm'){const p=byId(f.id==='addIdea'?f.dataset.pid:(f.querySelector('input[name=who]:checked')||{}).value);if(!p){err.textContent='Pick who the idea is for.';return}if(!T){err.textContent='Type the idea first.';f.t.focus();return}const raw=f.u.value.trim(),u=normUrl(raw);if(raw&&!u){err.textContent="That link doesn't look right. Check it or leave it blank.";return}p.ideas.push({id:uid(),text:T,url:u,created:Date.now()});if(p.ideas.length===1)JW.add(p.id);save();if(f.id==='quickForm')closeSheet();render(false);celebrate();toast(`Saved for ${p.name}!`);return}
 if(f.id==='ideaForm'){const p=byId(f.dataset.pid),i=ideaOf(p,f.dataset.iid);if(!T){err.textContent='The idea needs some words.';return}const raw=f.u.value.trim(),u=normUrl(raw);if(raw&&!u){err.textContent="That link doesn't look right.";return}i.text=T;i.url=u;item(p).gifts.forEach(z=>{if(z.iid===i.id)z.text=T});save();closeSheet();render(false);toast('Idea updated',false);return}
 if(f.id==='giftForm'){const p=byId(f.dataset.pid),i=ideaOf(p,f.dataset.iid),o=(f.querySelector('input[name=o]:checked')||{}).value||'Just because';p.ideas=p.ideas.filter(x=>x!==i);p.history.push({id:uid(),text:i.text,url:i.url||'',occ:o,date:Date.now()});const g=item(p).gifts;g.forEach(z=>{if(z.iid===i.id)z.text=i.text});setGifts(p,g);save();closeSheet();render(false);confetti(40);toast('Moved to gift history');return}
 if(f.id==='lockForm'){const p=byId(f.dataset.pid),old=item(p).gifts,picks=[...f.querySelectorAll('input[name=pick]:checked')].map(x=>x.value);if(T){const i={id:uid(),text:T,url:'',created:Date.now()};p.ideas.push(i);picks.push(i.id)}const g=picks.map(id=>{const o=old.find(z=>z.iid===id),i=ideaOf(p,id);return{iid:id,text:i?i.text:(o?o.text:''),bought:o?o.bought:false}});const more=g.length>old.length;setGifts(p,g);save();closeSheet();if(more)bells();render(false);toast(g.length?`${g.length} ${g.length===1?'gift':'gifts'} locked in for ${p.name}`:`Gifts cleared for ${p.name}`,g.length>0);return}
 if(f.id==='personForm'){const name=f.elements.pname.value.trim();if(!name){err.textContent='Add a name.';f.elements.pname.focus();return}let p=byId(f.dataset.pid);const isNew=!p;if(isNew){p={id:uid(),name,group:'',occ:{},bday:'',ideas:[],history:[]}}p.name=name;p.group=f.group.value;for(const k in OCC)p.occ[k]={on:f['on_'+k].checked,budget:f['b_'+k].value.trim()};const bd=+f.elements.bdd.value,bm=+f.elements.bdm.value;if((bd&&!bm)||(bm&&!bd)){err.textContent='Pick both a day and a month for the birthday, or leave both blank.';return}if(bd&&bd>[31,29,31,30,31,30,31,31,30,31,30,31][bm-1]){err.textContent="That date doesn't exist. Check the day and month.";return}p.bday=bd?String(bm).padStart(2,'0')+'-'+String(bd).padStart(2,'0'):'';if(isNew)S.people.push(p);if(p.group!==SSG&&S.xmas.drawn===p.id)S.xmas.drawn='';save();closeSheet();if(isNew){go('home',p.id);toast(`${name} added!`)}else{render(false);toast('Saved',false)}return}
});

/* ---------- start ---------- */
if('serviceWorker' in navigator&&location.protocol==='https:'&&location.hostname.endsWith('github.io')){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
advSync();render(true);if(season().xday)setTimeout(()=>confetti(70),400);
}
</script>
